<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<title>Claude Stats</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0F0F0;
    --card-bg: #ffffff;
    --text: #1A1A1A;
    --muted: #8A8A8A;
    --track: #EAEAEA;
    --accent-blue: #4B7BEC;
    --icon-color: #8A8A8A;
    --icon-hover-bg: rgba(0,0,0,0.07);
    --icon-hover-color: #1A1A1A;
    --status-ok: #34C759;
    --status-stale: #FF9500;
    --status-error: #FF3B30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1C1E;
      --card-bg: #2C2C2E;
      --text: #F2F2F2;
      --muted: #9A9A9E;
      --track: #3A3A3C;
      --accent-blue: #6B93F5;
      --icon-color: #9A9A9E;
      --icon-hover-bg: rgba(255,255,255,0.08);
      --icon-hover-color: #F2F2F2;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    width: 360px;
    color: var(--text);
    font-size: 13px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-title {
    font-weight: 700;
    font-size: 15px;
    flex: 1;
    color: var(--text);
  }
  .icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-color);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--icon-hover-bg); color: var(--icon-hover-color); }
  .icon-btn.spinning svg { animation: spin 1s linear infinite; }
  #settingsBtn { position: relative; }
  #settingsBtn.active { color: var(--accent-blue); }
  #settingsBtn svg { transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  #settingsBtn.active svg { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) {
    #settingsBtn svg { transition: none; }
  }
  #settingsBtn .badge {
    position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; border-radius: 50%;
    display: none;
  }
  #settingsBtn .badge.update { display: block; background: var(--status-stale); }
  #settingsBtn .badge.stale { display: block; background: var(--status-stale); }
  #settingsBtn .badge.disconnected { display: block; background: var(--status-error); }

  /* ---- Views: main (cards) and settings share the same space ---- */
  .view { display: flex; flex-direction: column; gap: 10px; }
  .view[hidden] { display: none; }

  /* ---- Settings ---- */
  .settings-card { padding: 4px 14px; }
  .setting-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; min-height: 46px;
  }
  .setting-row + .setting-row { border-top: 1px solid var(--track); }
  .setting-text { flex: 1; min-width: 0; }
  .setting-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .setting-sub {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting-sub.error { color: var(--status-error); white-space: normal; }
  .setting-value { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .switch {
    position: relative; width: 36px; height: 21px; flex-shrink: 0;
    border: none; border-radius: 11px; cursor: pointer; padding: 0;
    background: var(--track); transition: background 0.2s;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 17px; height: 17px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.2s;
  }
  .switch[aria-checked="true"] { background: var(--status-ok); }
  .switch[aria-checked="true"]::after { transform: translateX(15px); }
  .switch:disabled { opacity: 0.4; cursor: default; }

  .segmented {
    display: flex; flex-shrink: 0; padding: 2px; gap: 2px;
    background: var(--track); border-radius: 7px;
  }
  .segmented button {
    border: none; background: transparent; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 600; color: var(--muted);
    padding: 4px 8px; border-radius: 5px;
    transition: background 0.15s, color 0.15s;
  }
  .segmented button[aria-checked="true"] {
    background: var(--card-bg); color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .update-btn {
    border: none; border-radius: 6px; cursor: pointer;
    padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600;
    background: var(--accent-blue); color: #fff; white-space: nowrap;
  }
  .update-btn:disabled { opacity: 0.6; cursor: default; }
  .update-btn[hidden] { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Cards ---- */
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 14px;
  }
  .card-session {
    background: color-mix(in srgb, var(--stress-color, #34C759) 14%, var(--card-bg));
    transition: background 0.4s ease;
  }

  /* ---- Session donut ---- */
  .session-inner {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .donut-wrap {
    position: relative;
    width: 90px;
    height: 90px;
    flex-shrink: 0;
  }
  .donut-wrap svg {
    transform: rotate(-90deg);
  }
  .donut-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    line-height: 1;
  }
  .donut-face {
    font-size: 34px;
    line-height: 1;
    display: block;
  }
  @keyframes skull-shake {
    0%, 92%, 100% { transform: translateX(0) rotate(0); }
    93% { transform: translateX(-2px) rotate(-4deg); }
    94% { transform: translateX(2px) rotate(4deg); }
    95% { transform: translateX(-2px) rotate(-3deg); }
    96% { transform: translateX(2px) rotate(3deg); }
    97% { transform: translateX(0) rotate(0); }
  }
  .donut-face.stressed {
    animation: skull-shake 3s ease-in-out infinite;
  }
  #donutTrack {
    stroke: color-mix(in srgb, var(--stress-color, #34C759) 30%, var(--card-bg));
    transition: stroke 0.4s ease;
  }
  .session-info {
    flex: 1;
  }
  .label-sm {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .session-reset {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---- Weekly card ---- */
  .weekly-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .weekly-pct-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .weekly-pct-label span {
    color: var(--accent-blue);
  }
  .progress-bar-track {
    height: 6px;
    background: var(--track);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 5px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent-blue);
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    min-width: 2px;
  }
  #donutFill {
    transition: stroke-dasharray 0.6s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
  }
  .no-transition, .no-transition * {
    transition: none !important;
  }
  .weekly-reset {
    font-size: 11px;
    color: var(--muted);
  }

  /* ---- Footer ---- */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    padding: 0 2px;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    flex-shrink: 1;
  }
  #accountText {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #lastUpdated {
    flex-shrink: 0;
    margin-left: 8px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--status-ok);
    display: inline-block;
    flex-shrink: 0;
  }
  .footer .status-dot { display: none; }
  .footer .status-dot.stale, .footer .status-dot.disconnected { display: inline-block; }
  .status-dot.stale { background: var(--status-stale); }
  .status-dot.disconnected { background: var(--status-error); }

  /* Fetching overlay pulse */
  .fetching-pulse {
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <span class="header-title" id="headerTitle">Claude Stats</span>
    <button class="icon-btn" id="refreshBtn" title="Vernieuwen" onclick="onRefresh()">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M13.5 7.5a6 6 0 1 1-1.5-3.95" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Instellingen" onclick="toggleSettings()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
      <span class="badge" id="settingsBadge"></span>
    </button>
    <button class="icon-btn" title="Afsluiten" onclick="onQuit()">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="view" id="mainView">
  <!-- Session card -->  <!-- Session card -->
  <div class="card card-session">
    <div class="session-inner">
      <div class="donut-wrap">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle id="donutTrack" cx="45" cy="45" r="36" fill="none" stroke-width="9"/>
          <circle id="donutFill" cx="45" cy="45" r="36" fill="none"
                  stroke-width="9"
                  stroke-linecap="round"
                  stroke-dasharray="0 226.2"/>
        </svg>
        <div class="donut-center">
          <span class="donut-face" id="sessionFace">🚀</span>
        </div>
      </div>
      <div class="session-info">
        <div class="label-sm">Current Session</div>
        <div style="font-size:13px; font-weight:600;" id="sessionPctText">—%</div>
        <div class="session-reset" id="sessionReset">Resets in —</div>
      </div>
    </div>
  </div>

  <!-- Weekly card -->
  <div class="card">
    <div class="weekly-header">
      <div class="label-sm">Weekly Limit</div>
      <div class="weekly-pct-label"><span id="weeklyPctLabel">—</span>% gebruikt</div>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="weeklyBar" style="width:0%"></div>
    </div>
    <div class="weekly-reset" id="weeklyReset">Reset —</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-left">
      <span class="status-dot" id="statusDot"></span>
      <span id="accountText"></span>
    </div>
    <span id="lastUpdated"></span>
  </div>
  </div>

  <!-- Settings -->
  <div class="view" id="settingsView" hidden>
    <div class="card settings-card">
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-title">Meldingen</div>
          <div class="setting-sub">Bij 80% en 95% sessie, 90% week</div>
        </div>
        <button class="switch" id="notifySwitch" role="switch" aria-checked="false" onclick="onToggleNotifications()"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-title">Menubalk</div>
          <div class="setting-sub" id="menubarPreview"></div>
        </div>
        <div class="segmented" role="radiogroup" id="menubarStyle">
          <button role="radio" data-style="full" onclick="onMenubarStyle('full')">Alles</button>
          <button role="radio" data-style="session" onclick="onMenubarStyle('session')">Sessie</button>
          <button role="radio" data-style="emoji" onclick="onMenubarStyle('emoji')">Emoji</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-title">Versie <span class="setting-value" id="versionText"></span></div>
          <div class="setting-sub" id="updateText">Up-to-date</div>
        </div>
        <button class="update-btn" id="updateBtn" hidden onclick="onStartUpdate()"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-title">Verbinding</div>
          <div class="setting-sub" id="connText">Verbinden…</div>
        </div>
        <span class="status-dot" id="connDot"></span>
      </div>
    </div>
  </div>

</div>

<script>
'use strict';

const CIRC = 2 * Math.PI * 36; // 226.2

let _currentData = null;

// ---- Public API ----

window.updateData = function(data) {
  _currentData = data;
  render(data);
};

// Called on popover open: reset donut + bar to 0 without transition, then
// fill them in with a smooth transition so the open feels alive every time.
window.openWithAnimation = function(data) {
  toggleSettings(false, true);  // always open on the main view, no animation
  const donut = document.getElementById('donutFill');
  const bar = document.getElementById('weeklyBar');
  donut.classList.add('no-transition');
  bar.classList.add('no-transition');
  donut.setAttribute('stroke-dasharray', '0 226.2');
  bar.style.width = '0%';
  void donut.getBoundingClientRect(); // force reflow so the 0% state actually paints
  setTimeout(() => {
    donut.classList.remove('no-transition');
    bar.classList.remove('no-transition');
    _currentData = data;
    render(data);
  }, 100);
};

window.setStatus = function(status) {
  const btn = document.getElementById('refreshBtn');
  if (status === 'fetching') {
    btn.classList.add('spinning');
  } else {
    btn.classList.remove('spinning');
  }
};

// ---- Render ----

function faceForPct(pct) {
  if (pct >= 100) return '💀';
  if (pct >= 90) return '😱';
  if (pct >= 75) return '😰';
  if (pct >= 60) return '😨';
  if (pct >= 40) return '😅';
  if (pct >= 20) return '🙂';
  return '🚀';
}

// Green -> orange -> red as the session fills up (two-stage lerp).
function colorForPct(pct) {
  const stops = pct <= 50
    ? [[0, 47, 168, 74], [50, 255, 149, 0]]
    : [[50, 255, 149, 0], [100, 255, 59, 48]];
  const [p0, r0, g0, b0] = stops[0];
  const [p1, r1, g1, b1] = stops[1];
  const t = p1 === p0 ? 0 : (pct - p0) / (p1 - p0);
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r}, ${g}, ${b})`;
}

function render(d) {
  // Session donut
  const pct = Math.max(0, Math.min(100, d.session_pct || 0));
  const filled = (pct / 100) * CIRC;
  const gap = CIRC - filled;
  const color = colorForPct(pct);
  const donutFill = document.getElementById('donutFill');
  donutFill.setAttribute('stroke-dasharray', `${filled.toFixed(1)} ${gap.toFixed(1)}`);
  donutFill.style.stroke = color;
  document.querySelector('.card-session').style.setProperty('--stress-color', color);
  const face = document.getElementById('sessionFace');
  face.textContent = faceForPct(pct);
  face.classList.toggle('stressed', pct >= 100);
  document.getElementById('sessionPctText').textContent = pct + '%';
  document.getElementById('sessionPctText').style.color = color;
  document.getElementById('sessionReset').textContent = 'Reset ' + (d.session_reset || '—');

  // Weekly
  const wpct = Math.max(0, Math.min(100, d.weekly_pct || 0));
  document.getElementById('weeklyPctLabel').textContent = wpct;
  document.getElementById('weeklyBar').style.width = wpct + '%';
  document.getElementById('weeklyReset').textContent = 'Reset ' + (d.weekly_reset || '—');

  // Status: 'ok' | 'stale' | 'not_logged_in'. Only problems surface on the
  // main view (dot before the account); details live in settings.
  const problem = d.status === 'stale' ? 'stale' : d.status === 'not_logged_in' ? 'disconnected' : '';
  const statusText = d.status === 'stale' ? (d.status_reason || 'Kon niet vernieuwen')
    : d.status === 'not_logged_in' ? (d.status_reason || 'Niet ingelogd')
    : 'Verbonden met Anthropic API';
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (problem ? ' ' + problem : '');
  dot.title = problem ? statusText : '';
  document.getElementById('accountText').textContent = d.account || '';
  document.getElementById('lastUpdated').textContent = d.last_updated ? 'Bijgewerkt: ' + d.last_updated : '';

  // Settings view
  const connDot = document.getElementById('connDot');
  connDot.className = 'status-dot' + (problem ? ' ' + problem : '');
  document.getElementById('connText').textContent =
    statusText + (d.last_updated ? ' · ' + d.last_updated : '');
  const sw = document.getElementById('notifySwitch');
  sw.setAttribute('aria-checked', d.notifications_enabled ? 'true' : 'false');
  sw.disabled = !d.notifications_available;
  document.getElementById('versionText').textContent =
    d.version && d.version !== 'dev' ? 'v' + d.version : (d.version || '');
  document.getElementById('versionText').title = d.build ? 'Build ' + d.build : '';
  renderUpdate(d.update);
  renderMenubarStyle(d.menubar_style || 'full', d.menubar_previews || {});

  // Badge on the gear: update available, or a connection problem
  document.getElementById('settingsBadge').className =
    'badge' + (problem ? ' ' + problem : d.update && d.update.state !== 'working' ? ' update' : '');

  // Fetching spinner
  window.setStatus(d.fetching ? 'fetching' : 'ready');
}

// ---- Actions ----

function onRefresh() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.refresh) {
    window.webkit.messageHandlers.refresh.postMessage(null);
  }
  document.getElementById('refreshBtn').classList.add('spinning');
}

let _viewAnimating = false;

// Swap main <-> settings. Outgoing view fades and slides out, incoming slides
// in from the other side (settings from the right, main from the left).
function toggleSettings(show, instant) {
  const settings = document.getElementById('settingsView');
  const main = document.getElementById('mainView');
  const open = show === undefined ? settings.hidden : show;
  if (open === !settings.hidden) return;
  if (_viewAnimating && !instant) return;

  document.getElementById('settingsBtn').classList.toggle('active', open);
  const title = document.getElementById('headerTitle');
  const from = open ? main : settings;
  const to = open ? settings : main;
  const swap = () => {
    from.hidden = true;
    to.hidden = false;
    title.textContent = open ? 'Instellingen' : 'Claude Stats';
  };

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduced || !from.animate) { swap(); return; }

  _viewAnimating = true;
  const dir = open ? 1 : -1;
  const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const out = from.animate(
    [{ opacity: 1, transform: 'translateX(0)' },
     { opacity: 0, transform: `translateX(${-12 * dir}px)` }],
    { duration: 110, easing: 'ease-in', fill: 'forwards' });
  const titleOut = title.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, fill: 'forwards' });
  out.onfinish = () => {
    swap();
    // Cancel the filled fade-outs, otherwise they keep holding opacity 0
    // once the fade-ins below have finished.
    out.cancel();
    titleOut.cancel();
    title.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: ease });
    const inn = to.animate(
      [{ opacity: 0, transform: `translateX(${16 * dir}px)` },
       { opacity: 1, transform: 'translateX(0)' }],
      { duration: 240, easing: ease });
    inn.onfinish = () => { _viewAnimating = false; };
  };
}

function renderUpdate(u) {
  const btn = document.getElementById('updateBtn');
  const txt = document.getElementById('updateText');
  txt.classList.remove('error');
  if (!u) {
    btn.hidden = true;
    txt.textContent = 'Up-to-date';
    return;
  }
  btn.hidden = false;
  btn.disabled = u.state === 'working';
  btn.textContent = u.state === 'working' ? 'Bijwerken…'
    : u.state === 'error' ? 'Opnieuw' : 'Bijwerken';
  if (u.state === 'error') {
    txt.classList.add('error');
    txt.textContent = 'Mislukt: ' + u.message;
  } else {
    txt.textContent = 'v' + u.version + ' is beschikbaar';
  }
}

function onStartUpdate() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.startUpdate) {
    window.webkit.messageHandlers.startUpdate.postMessage(null);
  }
}

let _menubarPreviews = {};

function renderMenubarStyle(style, previews) {
  _menubarPreviews = previews;
  document.querySelectorAll('#menubarStyle button').forEach(b =>
    b.setAttribute('aria-checked', b.dataset.style === style ? 'true' : 'false'));
  document.getElementById('menubarPreview').textContent = previews[style] || '';
}

function onMenubarStyle(style) {
  renderMenubarStyle(style, _menubarPreviews);  // optimistic; Python pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setMenubarStyle) {
    window.webkit.messageHandlers.setMenubarStyle.postMessage(style);
  }
}

function onToggleNotifications() {
  const sw = document.getElementById('notifySwitch');
  if (sw.disabled) return;
  const enabled = sw.getAttribute('aria-checked') !== 'true';
  sw.setAttribute('aria-checked', enabled ? 'true' : 'false');  // optimistic; Python pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setNotifications) {
    window.webkit.messageHandlers.setNotifications.postMessage(enabled);
  }
}

function onQuit() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.quit) {
    window.webkit.messageHandlers.quit.postMessage(null);
  }
}

(function init() {
  // Placeholder until Python calls updateData
  document.getElementById('accountText').textContent = 'Laden…';
})();
