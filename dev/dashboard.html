<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<title>Claude Stats</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ==== Design tokens (docs/DESIGN.md) ====
     Every colour, size, space, radius, font and duration below comes from here.
     Change a value here, not in a rule. Colour tokens get a dark value in the
     media query; the other families are the same in both themes. */
  :root {
    /* -- Colour: surfaces and text -- */
    --bg: #F0F0F0;
    --card-bg: #ffffff;
    --text: #1A1A1A;
    --muted: #636366;          /* ≥4.5:1 on card, page and tinted session card */
    --track: #EAEAEA;
    --on-accent: #FFFFFF;      /* text on accent-blue, switch knob */
    /* -- Colour: accent (the week) -- */
    --accent-blue: #4B7BEC;
    --time-fill: color-mix(in srgb, var(--accent-blue) 30%, var(--track));
    /* Text colours checked against WCAG 2.2 AA (4.5:1) on the white card;
       fills keep the lighter accent — their values are also given as text. */
    --accent-text: #3366D6;    /* 5.23:1 */
    --time-text: #4D6FB3;      /* 4.95:1, muted blue-grey of the time fill */
    /* -- Colour: icons -- */
    --icon-color: #8A8A8A;
    --icon-hover-bg: rgba(0,0,0,0.07);
    --icon-hover-color: #1A1A1A;
    /* -- Colour: status (same in both themes) -- */
    --status-ok: #34C759;
    --status-stale: #FF9500;
    --status-error: #FF3B30;
    /* -- Colour: session stress ramp, read by colorForPct() (same in both themes) -- */
    --stress-low: #2FA84A;     /* 0% */
    --stress-mid: #FF9500;     /* 50% */
    --stress-high: #FF3B30;    /* 100% */
    --stress-tint: 14%;        /* session card: stress colour over card-bg */
    --stress-track: 30%;       /* donut track: stress colour over card-bg */

    /* -- Shadow -- */
    --shadow-segment: 0 1px 2px rgba(0,0,0,0.15);
    --shadow-knob: 0 1px 2px rgba(0,0,0,0.25);

    /* -- Type -- */
    --font-system: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    --text-face: 34px;         /* emoji in the donut */
    --text-title: 15px;        /* header title */
    --text-body: 13px;         /* body, row titles, values */
    --text-secondary: 12px;    /* session reset, row values, buttons */
    --text-caption: 11px;      /* footer, week reset, sub lines, segmented */
    --text-group: 10.5px;      /* group label above a settings card */
    --text-label: 10px;        /* small caps label inside a card */
    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;
    --weight-bold: 700;
    --tracking-caps: 0.06em;   /* uppercase labels */

    /* -- Space (named by px; the popover is a fixed 360 px wide) -- */
    --space-1: 1px;
    --space-2: 2px;
    --space-4: 4px;
    --space-5: 5px;
    --space-6: 6px;
    --space-8: 8px;
    --space-9: 9px;
    --space-10: 10px;
    --space-12: 12px;
    --space-14: 14px;          /* popover edge and card padding */

    /* -- Radius -- */
    --radius-bar: 3px;         /* progress bar, focus ring */
    --radius-chip: 4px;        /* version chip */
    --radius-sm: 5px;          /* active segment, menu bar pill */
    --radius-md: 6px;          /* icon button, update button */
    --radius-control: 7px;     /* segmented control */
    --radius-inset: 8px;       /* preview strip */
    --radius-pill: 11px;       /* switch */
    --radius-card: 12px;       /* cards */
    --radius-round: 50%;       /* dots, knob */

    /* -- Size -- */
    --popover-width: 360px;    /* fixed: another width makes the popover jump */
    --size-icon-button: 28px;
    --size-donut: 90px;
    --size-bar: 6px;           /* week bar height */
    --size-tick: 2px;          /* week position tick */
    --size-dot: 7px;
    --size-dot-small: 6px;     /* connection row dots, gear badge */
    --size-row: 46px;          /* settings row min height */
    --size-row-compact: 40px;  /* version row */
    --size-pill: 22px;         /* menu bar pill min height */
    --size-switch-w: 36px;
    --size-switch-h: 21px;
    --size-knob: 17px;
    --max-pill: 220px;         /* menu bar preview text */
    --max-account: 140px;      /* account name gives way to the org name */
    --focus-ring: 2px;
    --underline-strong: 2px;   /* link underline on hover */
    --opacity-disabled: 0.4;   /* switch that cannot be used */
    --opacity-busy: 0.6;       /* update button while working */

    /* -- Motion -- */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 0.15s;         /* hover, segment switch */
    --dur-base: 0.2s;          /* switch */
    --dur-slow: 0.4s;          /* stress colour change */
    --dur-fill: 0.6s;          /* donut and bar fill */
    --dur-spin: 1s;
    --dur-pulse: 1.5s;
    --dur-shake: 3s;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1C1E;
      --card-bg: #2C2C2E;
      --text: #F2F2F2;
      --muted: #ABABB0;          /* ≥4.5:1 incl. orange-tinted session card */
      --track: #3A3A3C;
      --accent-blue: #6B93F5;
      --time-fill: color-mix(in srgb, var(--accent-blue) 30%, var(--track));
      --accent-text: var(--accent-blue);  /* 4.72:1 on #2C2C2E */
      --time-text: #9DB5F2;               /* 6.85:1 */
      --icon-color: #9A9A9E;
      --icon-hover-bg: rgba(255,255,255,0.08);
      --icon-hover-color: #F2F2F2;
    }
  }

  body {
    font-family: var(--font-system);
    background: var(--bg);
    width: var(--popover-width);
    color: var(--text);
    font-size: var(--text-body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    padding: var(--space-14) var(--space-14) var(--space-12);
    display: flex;
    flex-direction: column;
    gap: var(--space-10);
  }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    gap: var(--space-8);
  }
  .header-title {
    font-weight: var(--weight-bold);
    font-size: var(--text-title);
    flex: 1;
    color: var(--text);
  }
  .icon-btn {
    width: var(--size-icon-button);
    height: var(--size-icon-button);
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-color);
    transition: background var(--dur-fast);
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--icon-hover-bg); color: var(--icon-hover-color); }
  .icon-btn.spinning svg { animation: spin var(--dur-spin) linear infinite; }
  #settingsBtn { position: relative; }
  #settingsBtn .badge {
    position: absolute; top: var(--space-4); right: var(--space-4);
    width: var(--size-dot-small); height: var(--size-dot-small); border-radius: var(--radius-round);
    display: none;
  }
  #settingsBtn .badge.update { display: block; background: var(--status-stale); }
  #settingsBtn .badge.stale { display: block; background: var(--status-stale); }
  #settingsBtn .badge.disconnected { display: block; background: var(--status-error); }
  .icon-btn[hidden] { display: none; }
  #backBtn { margin-left: calc(-1 * var(--space-6)); margin-right: calc(-1 * var(--space-4)); }

  /* ---- Views: main (cards) and settings share the same space ---- */
  .view { display: flex; flex-direction: column; gap: var(--space-10); }
  .view[hidden] { display: none; }

  /* ---- Settings ---- */
  .settings-card { padding: var(--space-4) var(--space-14); }
  .setting-row {
    display: flex; align-items: center; gap: var(--space-10);
    padding: var(--space-8) 0; min-height: var(--size-row);
  }
  .setting-row[hidden] { display: none; }
  .setting-row.version {
    min-height: var(--size-row-compact); flex-wrap: wrap;
  }
  .setting-row + .setting-row { border-top: var(--space-1) solid var(--track); }
  .setting-text { flex: 1; min-width: 0; }
  .setting-title { font-size: var(--text-body); font-weight: var(--weight-semibold); color: var(--text); }
  .setting-sub {
    font-size: var(--text-caption); color: var(--muted); margin-top: var(--space-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting-sub.error { color: var(--status-error); white-space: normal; }
  .ring-preview { vertical-align: -2px; color: var(--text); }   /* optical baseline nudge */
  .setting-value { font-size: var(--text-secondary); color: var(--muted); white-space: nowrap; }

  /* Grouped settings: small caps label above each card */
  .settings-group { display: flex; flex-direction: column; gap: var(--space-5); }
  .group-label {
    font-size: var(--text-group); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-caps);
    text-transform: uppercase; color: var(--muted); padding: 0 var(--space-14);
  }
  .setting-row.has-preview { flex-direction: column; align-items: stretch; gap: var(--space-8); padding-bottom: var(--space-10); }
  .setting-main { display: flex; align-items: center; gap: var(--space-10); }
  /* Preview: a strip of "menu bar" with the item as it will look */
  .preview-box {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-10);
    background: var(--bg); border-radius: var(--radius-inset); padding: var(--space-6) var(--space-6) var(--space-6) var(--space-10);
  }
  .preview-label { font-size: var(--text-caption); color: var(--muted); }
  .menubar-pill {
    display: inline-flex; align-items: center; gap: var(--space-4); min-height: var(--size-pill);
    padding: var(--space-2) var(--space-8); border-radius: var(--radius-sm); background: var(--card-bg);
    border: var(--space-1) solid var(--track);
    font-size: var(--text-secondary); font-weight: var(--weight-medium); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: var(--max-pill);
  }
  .version-chip {
    font: var(--weight-regular) var(--text-caption) var(--font-mono); color: var(--muted);
    background: var(--track); border-radius: var(--radius-chip); padding: var(--space-1) var(--space-5); margin-left: var(--space-4);
    vertical-align: 1px;   /* optical baseline nudge */
  }
  .version-status { display: flex; align-items: center; gap: var(--space-9); }
  .version-status .setting-sub { margin-top: 0; }

  .switch {
    position: relative; width: var(--size-switch-w); height: var(--size-switch-h); flex-shrink: 0;
    border: none; border-radius: var(--radius-pill); cursor: pointer; padding: 0;
    background: var(--track); transition: background var(--dur-base);
  }
  .switch::after {
    content: ''; position: absolute; top: var(--space-2); left: var(--space-2);
    width: var(--size-knob); height: var(--size-knob); border-radius: var(--radius-round);
    background: var(--on-accent); box-shadow: var(--shadow-knob);
    transition: transform var(--dur-base);
  }
  .switch[aria-checked="true"] { background: var(--status-ok); }
  .switch[aria-checked="true"]::after { transform: translateX(calc(var(--size-switch-w) - var(--size-knob) - 2 * var(--space-2))); }
  .switch:disabled { opacity: var(--opacity-disabled); cursor: default; }

  .segmented {
    display: flex; flex-shrink: 0; padding: var(--space-2); gap: var(--space-2);
    background: var(--track); border-radius: var(--radius-control);
  }
  .segmented button {
    border: none; background: transparent; cursor: pointer;
    font: inherit; font-size: var(--text-caption); font-weight: var(--weight-semibold); color: var(--muted);
    padding: var(--space-4) var(--space-8); border-radius: var(--radius-sm);
    transition: background var(--dur-fast), color var(--dur-fast);
  }
  .segmented button[aria-checked="true"] {
    background: var(--card-bg); color: var(--text);
    box-shadow: var(--shadow-segment);
  }

  .update-btn {
    border: none; border-radius: var(--radius-md); cursor: pointer;
    padding: var(--space-5) var(--space-10); font: inherit; font-size: var(--text-secondary); font-weight: var(--weight-semibold);
    background: var(--accent-blue); color: var(--on-accent); white-space: nowrap;
  }
  .update-btn:disabled { opacity: var(--opacity-busy); cursor: default; }
  .update-btn[hidden] { display: none; }

  /* Quiet text buttons under the settings card: uninstall left, quit right */
  .settings-actions {
    display: flex; justify-content: space-between; gap: var(--space-8); padding: 0 var(--space-4);
  }
  .text-btn {
    border: none; background: none; padding: var(--space-2) 0; cursor: pointer;
    font: inherit; font-size: var(--text-secondary); color: var(--muted);   /* ≥4.5:1 on the page */
  }
  .text-btn:hover { color: var(--text); text-decoration: underline; text-underline-offset: var(--space-2); }
  .text-btn:focus-visible { outline: var(--focus-ring) solid var(--accent-text); outline-offset: var(--space-1); border-radius: var(--radius-bar); }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Cards ---- */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    padding: var(--space-14);
  }
  .card-session {
    background: color-mix(in srgb, var(--stress-color, var(--status-ok)) var(--stress-tint), var(--card-bg));
    transition: background var(--dur-slow) ease;
  }

  /* ---- Session donut ---- */
  .session-inner {
    display: flex;
    align-items: center;
    gap: var(--space-14);
  }
  .donut-wrap {
    position: relative;
    width: var(--size-donut);
    height: var(--size-donut);
    flex-shrink: 0;
  }
  .donut-wrap svg {
    transform: rotate(-90deg);
  }
  .donut-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    line-height: 1;
  }
  .donut-face {
    font-size: var(--text-face);
    line-height: 1;
    display: block;
  }
  @keyframes skull-shake {
    0%, 92%, 100% { transform: translateX(0) rotate(0); }
    93% { transform: translateX(-2px) rotate(-4deg); }
    94% { transform: translateX(2px) rotate(4deg); }
    95% { transform: translateX(-2px) rotate(-3deg); }
    96% { transform: translateX(2px) rotate(3deg); }
    97% { transform: translateX(0) rotate(0); }
  }
  .donut-face.stressed {
    animation: skull-shake var(--dur-shake) ease-in-out infinite;
  }
  #donutTrack {
    stroke: color-mix(in srgb, var(--stress-color, var(--status-ok)) var(--stress-track), var(--card-bg));
    transition: stroke var(--dur-slow) ease;
  }
  .session-info {
    flex: 1;
  }
  .label-sm {
    font-size: var(--text-label);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-caps);
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: var(--space-4);
  }
  .session-pct {
    font-size: var(--text-body);
    font-weight: var(--weight-semibold);
  }
  .session-reset {
    font-size: var(--text-secondary);
    color: var(--muted);
    margin-top: var(--space-4);
  }
  /* Free limit reset(s) available: sits beside the donut, so no extra height */
  .resets-link {
    display: block; max-width: 100%; margin-top: var(--space-4);
    border: none; background: none; padding: 0; font: inherit; font-size: var(--text-caption); font-weight: var(--weight-semibold);
    color: var(--text); cursor: pointer; text-align: left; text-decoration: underline;
    text-underline-offset: var(--space-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .resets-link[hidden] { display: none; }
  .resets-link:hover { text-decoration-thickness: var(--underline-strong); }
  .resets-link:focus-visible { outline: var(--focus-ring) solid var(--accent-text); outline-offset: var(--space-1); border-radius: var(--radius-bar); }

  /* ---- Weekly card ---- */
  .weekly-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-8);
  }
  .weekly-pct-label {
    font-size: var(--text-body);
    font-weight: var(--weight-bold);
    color: var(--text);
  }
  #weeklyPctLabel {
    color: var(--accent-text);
  }
  .progress-bar-track {
    position: relative;
    height: var(--size-bar);
    background: var(--track);
    border-radius: var(--radius-bar);
    overflow: hidden;
    margin-bottom: var(--space-5);
  }
  /* Two fills in one track: elapsed week time behind, usage in front */
  .progress-bar-fill, .progress-bar-time {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: var(--radius-bar);
    transition: width var(--dur-fill) var(--ease-out);
  }
  .progress-bar-time {
    background: var(--time-fill);
  }
  .progress-bar-fill {
    background: var(--accent-blue);
    min-width: var(--size-tick);
  }
  /* Only when usage covers the time fill: mark where the week is */
  .progress-bar-tick {
    position: absolute; top: 0; bottom: 0; width: var(--size-tick); margin-left: calc(-0.5 * var(--size-tick));
    background: var(--card-bg);
    transition: left var(--dur-fill) var(--ease-out);
  }
  .progress-bar-tick[hidden] { display: none; }
  #donutFill {
    transition: stroke-dasharray var(--dur-fill) var(--ease-out), stroke var(--dur-slow) ease;
  }
  .no-transition, .no-transition * {
    transition: none !important;
  }
  .weekly-footer { display: flex; justify-content: space-between; gap: var(--space-8); }
  #weeklyElapsed[hidden] { display: none; }
  .time-num { color: var(--time-text); font-weight: var(--weight-semibold); }
  .weekly-reset {
    font-size: var(--text-caption);
    color: var(--muted);
  }

  /* ---- Footer ---- */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: var(--text-caption);
    color: var(--muted);
    padding: 0 var(--space-2);
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    min-width: 0;
    flex-shrink: 1;
  }
  .account-name {
    color: var(--text); font-size: var(--text-secondary); font-weight: var(--weight-semibold);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex-shrink: 0; max-width: var(--max-account);   /* the org name gives way first */
  }
  .account-plan { white-space: nowrap; flex-shrink: 0; }
  /* Shared org (Team): gives way first when the footer gets tight */
  .account-org {
    min-width: 0; flex-shrink: 3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .account-org:empty { display: none; }
  #lastUpdated {
    flex-shrink: 0;
    margin-left: var(--space-8);
  }
  .status-dot {
    width: var(--size-dot);
    height: var(--size-dot);
    border-radius: var(--radius-round);
    background: var(--status-ok);
    display: inline-block;
    flex-shrink: 0;
  }
  .footer .status-dot { display: none; }
  .footer .status-dot.stale, .footer .status-dot.disconnected { display: inline-block; }
  .status-dot.stale { background: var(--status-stale); }
  .status-dot.disconnected { background: var(--status-error); }
  .status-dot.neutral { background: var(--muted); }

  /* Connection row: own connection and Claude service status, one dot each */
  .conn-line { display: flex; align-items: center; gap: var(--space-6); }
  .conn-line .status-dot { width: var(--size-dot-small); height: var(--size-dot-small); }
  .conn-line span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  button.conn-link {
    border: none; background: none; padding: 0; font: inherit; font-size: var(--text-caption);
    color: var(--muted); cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: var(--space-6); min-width: 0; max-width: 100%;
  }
  button.conn-link:hover span.txt { text-decoration: underline; }
  button.conn-link:focus-visible { outline: var(--focus-ring) solid var(--accent-text); outline-offset: var(--space-1); border-radius: var(--radius-bar); }

  /* Fetching overlay pulse */
  .fetching-pulse {
    animation: pulse var(--dur-pulse) ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <button class="icon-btn" id="backBtn" hidden data-i18n-title="btn_back" title="Terug naar overzicht" onclick="toggleSettings(false)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M9.5 3L5 7.5l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="header-title" id="headerTitle">Claude Stats</span>
    <button class="icon-btn" id="refreshBtn" data-i18n-title="btn_refresh" title="Vernieuwen" onclick="onRefresh()">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M13.5 7.5a6 6 0 1 1-1.5-3.95" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="btn_settings" title="Instellingen" onclick="toggleSettings()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>

<script>
'use strict';

const CIRC = 2 * Math.PI * 36; // 226.2

let _currentData = null;

// ---- Translations: the table comes from core.STRINGS via updateData ----
let I18N = {};
function T(key, vars) {
  const text = I18N[key] !== undefined ? I18N[key] : key;
  return vars ? text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)) : text;
}
function applyI18n(d) {
  if (!d.i18n) return;
  I18N = d.i18n;
  document.documentElement.lang = d.lang || 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = T(el.dataset.i18nTitle); });
  const settingsOpen = !document.getElementById('settingsView').hidden;
  document.getElementById('headerTitle').textContent = T(settingsOpen ? 'settings_title' : 'app_title');
}

// ---- Public API ----

window.updateData = function(data) {
  _currentData = data;
  render(data);
};

// Called on popover open: reset donut + bar to 0 without transition, then
// fill them in with a smooth transition so the open feels alive every time.
window.openWithAnimation = function(data) {
  toggleSettings(false, true);  // always open on the main view, no animation
  const donut = document.getElementById('donutFill');
  const bar = document.getElementById('weeklyBar');
  const time = document.getElementById('weeklyTime');
  const tick = document.getElementById('weeklyTick');
  [donut, bar, time, tick].forEach(el => el.classList.add('no-transition'));
  donut.setAttribute('stroke-dasharray', '0 226.2');
  bar.style.width = '0%';
  time.style.width = '0%';
  tick.style.left = '0%';
  void donut.getBoundingClientRect(); // force reflow so the 0% state actually paints
  setTimeout(() => {
    [donut, bar, time, tick].forEach(el => el.classList.remove('no-transition'));
    _currentData = data;
    render(data);
  }, 100);
};

window.setStatus = function(status) {
  const btn = document.getElementById('refreshBtn');
  if (status === 'fetching') {
    btn.classList.add('spinning');
  } else {
    btn.classList.remove('spinning');
  }
};

// ---- Render ----

// Green -> orange -> red as the session fills up (two-stage lerp).
// Stops come from the --stress-low/-mid/-high tokens.
function colorForPct(pct) {
  const css = getComputedStyle(document.documentElement);
  const [low, mid, high] = ['--stress-low', '--stress-mid', '--stress-high'].map(n => hexToRgb(css.getPropertyValue(n)));
  const stops = pct <= 50
    ? [[0, ...low], [50, ...mid]]
    : [[50, ...mid], [100, ...high]];
  const [p0, r0, g0, b0] = stops[0];
  const [p1, r1, g1, b1] = stops[1];
  const t = p1 === p0 ? 0 : (pct - p0) / (p1 - p0);
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r}, ${g}, ${b})`;
}

// ---- WCAG text contrast for the stress-coloured percentage ----
// The session card is tinted with the stress colour (14% over the card), so
// the same colour as text fails 4.5:1. Darken it (light theme) or lighten it
// (dark theme) in small steps until it passes; the hue stays recognisable.

function parseRgb(str) {
  const m = str.match(/\d+/g);
  return m ? m.slice(0, 3).map(Number) : [0, 0, 0];
}
function hexToRgb(hex) {
  const h = hex.trim().replace('#', '');
  return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
}
function luminance([r, g, b]) {
  const ch = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * ch(r) + 0.7152 * ch(g) + 0.0722 * ch(b);
}
function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
function mixRgb(a, b, p) {  // p of a over b
  return a.map((v, i) => Math.round(v * p + b[i] * (1 - p)));
}
function readableStressColor(stressCss) {
  const stress = parseRgb(stressCss);
  const card = hexToRgb(getComputedStyle(document.documentElement).getPropertyValue('--card-bg'));
  const bg = mixRgb(stress, card, 0.14);              // same tint as .card-session
  const dark = luminance(card) < 0.2;
  const target = dark ? [255, 255, 255] : [0, 0, 0];
  for (let step = 0; step <= 20; step++) {
    const c = mixRgb(target, stress, step * 0.05);
    // 4.6, not 4.5: margin for rounding in the browser's own color-mix tint
    if (contrast(c, bg) >= 4.6) return `rgb(${c.join(', ')})`;
  }
  return dark ? '#FFFFFF' : '#000000';
}

function render(d) {
  applyI18n(d);  // first: static labels; dynamic text below overrides where needed

  // Session donut
  const pct = Math.max(0, Math.min(100, d.session_pct || 0));
  const filled = (pct / 100) * CIRC;
  const gap = CIRC - filled;
  const color = colorForPct(pct);
  const donutFill = document.getElementById('donutFill');
  donutFill.setAttribute('stroke-dasharray', `${filled.toFixed(1)} ${gap.toFixed(1)}`);
  donutFill.style.stroke = color;
  document.querySelector('.card-session').style.setProperty('--stress-color', color);
  const face = document.getElementById('sessionFace');
  face.textContent = d.session_face || '';   // UsageCore faceIcon, incl. seasonal theme
  face.classList.toggle('stressed', pct >= 100);
  document.getElementById('sessionPctText').textContent = pct + '%';
  document.getElementById('sessionPctText').style.color = readableStressColor(color);
  document.getElementById('resetsLink').style.color = readableStressColor(color);   // ≥4.6:1 on the tinted card
  document.getElementById('sessionReset').textContent = T('reset_prefix') + ' ' + (d.session_reset || '—');
  const resets = document.getElementById('resetsLink');
  resets.hidden = !d.limit_resets;
  resets.textContent = d.limit_resets ? d.limit_resets.text : '';
  resets.title = d.limit_resets ? d.limit_resets.tip : '';

  // Weekly
  const wpct = Math.max(0, Math.min(100, d.weekly_pct || 0));
  document.getElementById('weeklyPctLabel').textContent = wpct;
  document.getElementById('weeklyBar').style.width = wpct + '%';
  // Elapsed share of the weekly window (time, not usage) behind the usage fill
  const wp = d.week_progress;
  const time = document.getElementById('weeklyTime');
  const tick = document.getElementById('weeklyTick');
  const track = document.getElementById('weeklyTrack');
  if (wp) {
    const tpct = Math.max(0, Math.min(100, wp.elapsed_pct));
    time.style.width = tpct + '%';
    tick.style.left = tpct + '%';
    tick.hidden = !(wpct >= tpct && tpct > 0 && tpct < 100);
    track.title = T('week_tooltip', { day: wp.day, days: wp.days, elapsed: Math.round(tpct), used: wpct });
    document.getElementById('weeklyElapsedPct').textContent = Math.round(tpct);
    document.getElementById('weeklyElapsed').hidden = false;
    document.getElementById('weeklyElapsed').title = T('day_of', { day: wp.day, days: wp.days });
  } else {
    time.style.width = '0%';
    tick.hidden = true;
    track.title = '';
    document.getElementById('weeklyElapsed').hidden = true;
  }
  document.getElementById('weeklyReset').textContent = T('reset_prefix') + ' ' + (d.weekly_reset || '—');

  // Status: 'ok' | 'stale' | 'not_logged_in'. Only problems surface on the
  // main view (dot before the account); details live in settings.
  const problem = d.status === 'stale' ? 'stale' : d.status === 'not_logged_in' ? 'disconnected' : '';
  const statusText = d.status === 'stale' ? (d.status_reason || T('status_stale'))
    : d.status === 'not_logged_in' ? (d.status_reason || T('status_not_logged_in'))
    : T('status_ok');
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (problem ? ' ' + problem : '');
  const acc = d.account_label || { name: d.account || '', org: '', plan: '', email: d.account || '' };
  document.getElementById('accountName').textContent = acc.name;
  document.getElementById('accountOrg').textContent = acc.org ? '· ' + acc.org : '';
  document.getElementById('accountPlan').textContent = acc.plan ? '· ' + acc.plan : '';
  // Full text in the tooltip, as the org name may be cut off
  const full = [acc.name, acc.org, acc.plan].filter(Boolean).join(' · ');
  const who = acc.org ? full + ' — ' + acc.email : acc.email;
  document.getElementById('accountBox').title = problem ? statusText + ' — ' + who : who;
  document.getElementById('lastUpdated').textContent = d.last_updated ? T('updated', { when: d.last_updated }) : '';

  // Settings view
  const connDot = document.getElementById('connDot');
  connDot.className = 'status-dot' + (problem ? ' ' + problem : '');
  document.getElementById('connText').textContent =
    statusText + (d.last_updated ? ' · ' + d.last_updated : '');
  const sw = document.getElementById('notifySwitch');
  sw.setAttribute('aria-checked', d.notifications_enabled ? 'true' : 'false');
  sw.disabled = !d.notifications_available;
  document.getElementById('versionText').textContent =
    d.version && d.version !== 'dev' ? 'v' + d.version : (d.version || '');
  document.getElementById('versionText').title = d.build ? 'Build ' + d.build : '';
  renderUpdate(d.update);
  _menubarRing = d.menubar_icon === 'ring' ? (d.menubar_ring || { fraction: 0 }) : null;
  renderMenubarStyle(d.menubar_style || 'full', d.menubar_previews || {});
  renderAppearance(d.appearance || 'system');
  renderRefreshChoice(d.refresh_minutes || 5);
  renderMenubarIcon(d.menubar_icon || 'ring');
  renderSeason(d.season_theme, d.seasonal_faces !== false);

  renderService(d.service);

  // Badge on the gear: own connection problem, Claude outage, or update available
  const badgeClass = problem || d.service_badge || (d.update && d.update.state !== 'working' ? 'update' : '');
  document.getElementById('settingsBadge').className = 'badge' + (badgeClass ? ' ' + badgeClass : '');

  // Fetching spinner
  window.setStatus(d.fetching ? 'fetching' : 'ready');
  reportHeight();
}

// Claude service status: our own labels via T(); the API's description and
// component/incident names are shown as delivered (English, not translated).
let _statusUrl = '';
function renderService(svc) {
  const dot = document.getElementById('serviceDot');
  const text = document.getElementById('serviceText');
  const btn = document.getElementById('serviceBtn');
  let cls = 'neutral', label, tip = '';
  _statusUrl = 'https://status.claude.com/';   // always linked, also when all is well
  if (!svc) {
    label = T('svc_checking');
  } else if (svc.level === 'unreachable') {
    label = T('svc_unknown');
  } else if (svc.level === 'ok') {
    cls = ''; label = T('svc_ok');
  } else {
    cls = svc.level === 'minor' ? 'stale' : svc.level === 'unknown' ? 'neutral' : 'disconnected';
    const names = (svc.incidents || []).map(i => i.name).concat((svc.issues || []).map(i => i.name));
    const uniq = names.filter((n, i) => names.indexOf(n) === i);
    label = svc.description || T('svc_unknown');
    if (uniq.length) label += ': ' + uniq.join(', ');
    tip = label;
    if (svc.incidents && svc.incidents[0] && svc.incidents[0].url) _statusUrl = svc.incidents[0].url;
  }
  dot.className = 'status-dot' + (cls ? ' ' + cls : '');
  text.textContent = label;
  btn.title = (tip ? tip + ' — ' : '') + T('svc_open');
}

// ---- Actions ----

function onOpenResets() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openResetsPage) {
    window.webkit.messageHandlers.openResetsPage.postMessage(null);
  }
}

function onOpenStatus() {
  if (!_statusUrl) return;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openStatusPage) {
    window.webkit.messageHandlers.openStatusPage.postMessage(_statusUrl);
  }
}

function onRefresh() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.refresh) {
    window.webkit.messageHandlers.refresh.postMessage(null);
  }
  document.getElementById('refreshBtn').classList.add('spinning');
}

let _viewAnimating = false;

// Swap main <-> settings. Outgoing view fades and slides out, incoming slides
// in from the other side (settings from the right, main from the left).
function toggleSettings(show, instant) {
  const settings = document.getElementById('settingsView');
  const main = document.getElementById('mainView');
  const open = show === undefined ? settings.hidden : show;
  if (open === !settings.hidden) return;
  if (_viewAnimating && !instant) return;

  const title = document.getElementById('headerTitle');
  const from = open ? main : settings;
  const to = open ? settings : main;
  const swap = () => {
    from.hidden = true;
    to.hidden = false;
    // In settings the gear becomes a back chevron, so the way back is obvious.
    // Swapped while the title is faded out: the title shifts sideways unseen.
    document.getElementById('settingsBtn').hidden = open;
    document.getElementById('backBtn').hidden = !open;
    title.textContent = T(open ? 'settings_title' : 'app_title');
    reportHeight();
  };

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduced || !from.animate) { swap(); return; }

  _viewAnimating = true;
  const dir = open ? 1 : -1;
  const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const out = from.animate(
    [{ opacity: 1, transform: 'translateX(0)' },
     { opacity: 0, transform: `translateX(${-12 * dir}px)` }],
    { duration: 110, easing: 'ease-in', fill: 'forwards' });
  const titleOut = title.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, fill: 'forwards' });
  out.onfinish = () => {
    swap();
    // Cancel the filled fade-outs, otherwise they keep holding opacity 0
    // once the fade-ins below have finished.
    out.cancel();
    titleOut.cancel();
    title.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: ease });
    const inn = to.animate(
      [{ opacity: 0, transform: `translateX(${16 * dir}px)` },
       { opacity: 1, transform: 'translateX(0)' }],
      { duration: 240, easing: ease });
    inn.onfinish = () => { _viewAnimating = false; };
  };
}

// The popover is 296 px for the main view; the settings view reports its own
// content height so rows can breathe (app.py clamps and resizes the popover).
const MAIN_HEIGHT = 296;
let _reportedHeight = 0;
function reportHeight() {
  const settingsOpen = !document.getElementById('settingsView').hidden;
  const h = settingsOpen
    ? Math.max(MAIN_HEIGHT, Math.ceil(document.querySelector('.container').scrollHeight))
    : MAIN_HEIGHT;
  if (h === _reportedHeight) return;
  _reportedHeight = h;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.resize) {
    window.webkit.messageHandlers.resize.postMessage(h);
  }
}

function renderUpdate(u) {
  const btn = document.getElementById('updateBtn');
  const txt = document.getElementById('updateText');
  txt.classList.remove('error');
  if (!u) {
    btn.hidden = true;
    txt.textContent = T('up_to_date');
    return;
  }
  btn.hidden = false;
  btn.disabled = u.state === 'working';
  btn.textContent = u.state === 'working' ? T('update_working')
    : u.state === 'error' ? T('update_retry') : T('update_btn');
  if (u.state === 'error') {
    txt.classList.add('error');
    txt.textContent = T('update_failed', { message: u.message });
  } else {
    txt.textContent = T('update_available', { version: u.version });
  }
}

function onStartUpdate() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.startUpdate) {
    window.webkit.messageHandlers.startUpdate.postMessage(null);
  }
}

let _menubarPreviews = {};
let _menubarRing = null;

// The same ring as in the menu bar (MenubarIcon.swift): 16-unit box, 2-unit
// line, track at 35%, filled clockwise from 12 o'clock; monochrome below 75%,
// stress colour from 75% on.
function menubarRingSvg(ring) {
  const r = 6.5, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, ring.fraction || 0));
  const stroke = ring.color || 'currentColor';
  const cap = f < 1 ? 'round' : 'butt';
  const arc = f > 0
    ? `<circle cx="8" cy="8" r="${r}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="${cap}"
         stroke-dasharray="${(f * c).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 8 8)"/>`
    : '';
  return `<svg class="ring-preview" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="${r}" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/>${arc}</svg>`;
}

function renderMenubarStyle(style, previews) {
  _menubarPreviews = previews;
  document.querySelectorAll('#menubarStyle button').forEach(b =>
    b.setAttribute('aria-checked', b.dataset.style === style ? 'true' : 'false'));
  // In ring mode the third style shows just the icon: "Icon", not "Emoji" (stored value stays 'emoji')
  document.querySelector('#menubarStyle [data-style="emoji"]').textContent =
    T(_menubarRing ? 'style_icon' : 'style_emoji');
  const el = document.getElementById('menubarPreview');
  const text = previews[style] || '';
  if (_menubarRing) {
    el.innerHTML = menubarRingSvg(_menubarRing) + (text ? ' ' : '');
    el.appendChild(document.createTextNode(text));
  } else {
    el.textContent = text;
  }
}

function onMenubarStyle(style) {
  renderMenubarStyle(style, _menubarPreviews);  // optimistic; Python pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setMenubarStyle) {
    window.webkit.messageHandlers.setMenubarStyle.postMessage(style);
  }
}

function renderAppearance(appearance) {
  document.querySelectorAll('#appearanceStyle button').forEach(b =>
    b.setAttribute('aria-checked', b.dataset.appearance === appearance ? 'true' : 'false'));
}

function onAppearance(appearance) {
  renderAppearance(appearance);  // optimistic; Python pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setAppearance) {
    window.webkit.messageHandlers.setAppearance.postMessage(appearance);
  }
}

function renderMenubarIcon(icon) {
  document.querySelectorAll('#menubarIcon button').forEach(b =>
    b.setAttribute('aria-checked', b.dataset.icon === icon ? 'true' : 'false'));
}

function onMenubarIcon(icon) {
  renderMenubarIcon(icon);  // optimistic; the app pushes saved state back (incl. previews)
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setMenubarIcon) {
    window.webkit.messageHandlers.setMenubarIcon.postMessage(icon);
  }
}

function renderSeason(theme, enabled) {
  document.getElementById('seasonRow').hidden = !theme;
  if (!theme) return;
  document.getElementById('seasonSub').textContent = T('theme_' + theme.id) + ' ' + theme.faces;
  document.getElementById('seasonSwitch').setAttribute('aria-checked', enabled ? 'true' : 'false');
}

function onToggleSeasonal() {
  const sw = document.getElementById('seasonSwitch');
  const enabled = sw.getAttribute('aria-checked') !== 'true';
  sw.setAttribute('aria-checked', enabled ? 'true' : 'false');  // optimistic; the app pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setSeasonalFaces) {
    window.webkit.messageHandlers.setSeasonalFaces.postMessage(enabled);
  }
}

function renderRefreshChoice(minutes) {
  document.querySelectorAll('#refreshChoice button').forEach(b => {
    b.textContent = T('refresh_choice', { n: b.dataset.minutes });
    b.setAttribute('aria-checked', Number(b.dataset.minutes) === minutes ? 'true' : 'false');
  });
}

function onRefreshChoice(minutes) {
  renderRefreshChoice(minutes);  // optimistic; the app pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setRefresh) {
    window.webkit.messageHandlers.setRefresh.postMessage(minutes);
  }
}

function onToggleNotifications() {
  const sw = document.getElementById('notifySwitch');
  if (sw.disabled) return;
  const enabled = sw.getAttribute('aria-checked') !== 'true';
  sw.setAttribute('aria-checked', enabled ? 'true' : 'false');  // optimistic; Python pushes saved state back
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.setNotifications) {
    window.webkit.messageHandlers.setNotifications.postMessage(enabled);
  }
}

function onQuit() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.quit) {
    window.webkit.messageHandlers.quit.postMessage(null);
  }
}

// The cross only closes the popover; quitting lives in settings and on ⌘Q.
function onClose() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.close) {
    window.webkit.messageHandlers.close.postMessage(null);
  }
}

function onUninstall() {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.uninstall) {
    window.webkit.messageHandlers.uninstall.postMessage(null);
  }
}

// Escape: back from settings, otherwise close. ⌘Q quits.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    if (!document.getElementById('settingsView').hidden) toggleSettings(false);
    else onClose();
  } else if (e.metaKey && !e.shiftKey && !e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'q') {
    e.preventDefault();
    onQuit();
  }
});
